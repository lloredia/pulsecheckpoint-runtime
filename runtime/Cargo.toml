[package]
name = "pulse-runtime"
version = "0.1.0"
edition = "2021"
description = "Single-process gRPC service that stores checkpoint bytes in S3-compatible object storage"
license = "MIT"
repository = "https://github.com/lloredia/pulsecheckpoint-runtime"
readme = "../README.md"
publish = false
keywords = ["checkpoint", "grpc", "s3"]
categories = ["network-programming"]

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.12", features = ["behavior-version-latest"] }
# `rustls` on this crate is the legacy hyper 0.14 client (h2 0.3, rustls 0.21).
# `default-https-client` is the hyper 1 client. Keep that one only.
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
dotenvy = "0.15"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-reflection = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }

[[bin]]
name = "pulse-runtime"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
