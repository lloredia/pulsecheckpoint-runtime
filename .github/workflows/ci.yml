name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    env:
      PULSE_S3_ENDPOINT: http://127.0.0.1:9000
      PULSE_S3_BUCKET: checkpoints
      PULSE_S3_REGION: us-east-1
      PULSE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: localdev-secret
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: us-east-1
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdev-secret
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Start MinIO
        run: |
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          mkdir -p "${RUNNER_TEMP}/minio-data"
          "$(go env GOPATH)/bin/minio" server "${RUNNER_TEMP}/minio-data" --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > "${RUNNER_TEMP}/minio.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/minio.log"
          exit 1

      - name: Format
        run: cargo fmt --manifest-path runtime/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path runtime/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path runtime/Cargo.toml --locked --all-targets

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file runtime/Cargo.lock

      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path runtime/Cargo.toml check

  python:
    name: python client imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import the client and compile the example
        run: |
          python -m pip install --upgrade pip
          python -m pip install "grpcio>=1.76" "protobuf>=5"
          PYTHONPATH=sdk python -c "from pulse import Runtime, PulseError"
          python -m py_compile examples/basic_usage.py sdk/pulse/runtime.py

  docker:
    name: image build and Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: pulse-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulse-runtime:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/gitleaks.tar.gz gitleaks
      - name: Scan
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml
